# Tests, Companion's manifest check and the installable package on every push.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vioso-exaplay-package
          path: vioso-exaplay-*.tgz
          if-no-files-found: error
